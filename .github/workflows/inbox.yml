name: voice-inbox

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Сколько минут держать бота на линии"
        required: false
        default: "30"
  schedule:
    # Каждые 5 минут — столько ждёт первое сообщение. Дальше запуск видит,
    # что вы за телефоном, и отвечает вживую, пока не замолчите.
    - cron: "*/5 * * * *"

concurrency:
  group: inbox
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: pip install -q requests

      - name: Collect voice messages
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INBOX_IDLE_SECONDS: ${{ inputs.minutes && '900' || '150' }}
          INBOX_MAX_SECONDS: ${{ inputs.minutes && format('{0}', inputs.minutes * 60) || '600' }}
          INBOX_ALWAYS_LISTEN: ${{ inputs.minutes && '1' || '0' }}
        run: python worker/inbox.py

      - name: Commit recordings
        run: |
          git config user.name "pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A voice/
          git diff --cached --quiet || git commit -m "voice inbox"
          git pull --rebase origin main || true
          git push
