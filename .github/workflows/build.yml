name: build-videos

on:
  push:
    branches: [main]
    paths: ["jobs/**", "worker/**", "!worker/audition.py", ".github/workflows/build.yml"]
  workflow_dispatch: {}

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Python deps + browser
        run: |
          pip install -q -r worker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build approved jobs
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python worker/run_all.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            out/**/*.mp4
            out/**/status.md
            out/**/voices.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit status back
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A out/
          git diff --cached --quiet || git commit -m "render results [skip ci]"
          git pull --rebase origin main || true
          git push
