name: radar

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Окно в часах"
        required: false
        default: "36"
      top:
        description: "Сколько тем в дайджест"
        required: false
        default: "12"
  schedule:
    # 06:30 UTC — до начала рабочего дня в России, после ночи в Долине,
    # когда тамошнее обсуждение уже сложилось.
    - cron: "30 6 * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: pip install -q requests

      - name: Collect
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          RADAR_HOURS: ${{ inputs.hours || '36' }}
          RADAR_TOP: ${{ inputs.top || '12' }}
        run: |
          echo "RADAR_STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          RADAR_STAMP="$(date -u +%Y-%m-%d)" python worker/radar.py

      - name: Write the script
        # Без ключа шаг просто сообщает об этом и выходит: дайджест уже собран,
        # сценарий в этом случае пишется вручную.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: pip install -q anthropic && python worker/scriptgen.py || true

      - name: Commit digest
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A research/ jobs/
          git diff --cached --quiet || git commit -m "radar digest"
          git fetch origin main
          git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          git push origin HEAD:main
