<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sage:#A0AC91; --sage-l:#BDC7AE; --wine:#7B3F50; --cream:#F5F1E8;
    --paper:#EDE7D9; --charcoal:#2A2520; --stone:#8B8478;
  }
  html,body { width:1080px; height:1920px; overflow:hidden; background:var(--charcoal);
    font-family:'Geist',-apple-system,'Segoe UI',sans-serif; color:var(--cream); }
  #stage { position:relative; width:100%; height:100%; }

  /* ---- cards (title / outro) ---- */
  .card { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    align-items:flex-start; padding:0 90px; background:var(--charcoal); z-index:30;
    opacity:0; transition:opacity .18s ease; }
  .card.show { opacity:1; }
  .card .kicker { font-family:'Geist Mono',monospace; font-size:34px; letter-spacing:.18em;
    color:var(--sage); text-transform:uppercase; margin-bottom:36px; }
  .card h1 { font-family:'Geist Mono',monospace; font-weight:700; font-size:104px; line-height:1.08; }
  .card h2 { font-size:52px; font-weight:400; color:var(--stone); margin-top:40px; line-height:1.25; }
  .card .rule { width:120px; height:6px; background:var(--sage); margin-top:56px; }

  /* ---- chat ---- */
  #chat { position:absolute; top:150px; bottom:480px; left:0; right:0; padding:0 60px;
    display:flex; flex-direction:column; gap:34px; overflow:hidden; }
  #topbar { position:absolute; top:0; left:0; right:0; height:110px; display:flex; align-items:center;
    padding:0 60px; gap:22px; border-bottom:2px solid rgba(245,241,232,.09); background:var(--charcoal); z-index:10;}
  #topbar .dot { width:20px; height:20px; border-radius:50%; background:var(--sage); }
  #topbar .name { font-family:'Geist Mono',monospace; font-size:34px; color:var(--cream); }
  #topbar .sub { font-size:28px; color:var(--stone); margin-left:auto; }
  .msg { max-width:82%; padding:34px 42px; border-radius:28px; font-size:40px; line-height:1.42;
    white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:rgba(160,172,145,.22); border:2px solid rgba(160,172,145,.45);
    border-bottom-right-radius:8px; }
  .msg.ai { align-self:flex-start; background:rgba(245,241,232,.07); border:2px solid rgba(245,241,232,.12);
    border-bottom-left-radius:8px; }
  .msg .caret { display:inline-block; width:4px; height:1em; background:var(--sage); vertical-align:-2px;
    animation:blink .8s steps(1) infinite; }
  @keyframes blink { 50% {opacity:0;} }
  .msg table { border-collapse:collapse; margin-top:10px; font-size:34px; }
  .msg td, .msg th { border:2px solid rgba(245,241,232,.2); padding:14px 22px; text-align:left; }
  .msg th { font-family:'Geist Mono',monospace; color:var(--sage-l); font-size:28px; }

  /* ---- badge ---- */
  #badge { position:absolute; left:60px; bottom:520px; z-index:20; font-family:'Geist Mono',monospace;
    font-size:40px; font-weight:700; letter-spacing:.06em; color:var(--charcoal); background:var(--sage);
    padding:22px 36px; border-radius:16px; opacity:0; transform:translateY(20px);
    transition:all .3s ease; }
  #badge.show { opacity:1; transform:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar"><div class="dot"></div><div class="name">AI-чат</div><div class="sub">демо</div></div>
  <div id="chat"></div>
  <div id="badge"></div>
  <div class="card" id="card"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const chat = $('#chat');

function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }

async function typeInto(el, text, ms){
  const per = Math.max(12, ms / Math.max(1, text.length));
  const caret = document.createElement('span'); caret.className = 'caret';
  el.appendChild(caret);
  for (const ch of text){
    caret.insertAdjacentText('beforebegin', ch);
    scrollBottom();
    await sleep(per);
  }
  caret.remove();
}

function badge(text){
  const b = $('#badge');
  if (!text){ b.classList.remove('show'); return; }
  b.textContent = text; b.classList.add('show');
}

async function card(scene, durMs){
  const c = $('#card');
  c.innerHTML = (scene.kicker ? `<div class="kicker">${scene.kicker}</div>` : '')
    + (scene.h1 ? `<h1>${scene.h1}</h1>` : '')
    + (scene.h2 ? `<h2>${scene.h2}</h2>` : '')
    + '<div class="rule"></div>';
  c.classList.add('show');
  await sleep(durMs);
}

function hideCard(){ $('#card').classList.remove('show'); }

async function bubble(kind, scene, durMs){
  hideCard();
  if (scene.badge !== undefined) badge(scene.badge);
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  chat.appendChild(el); scrollBottom();
  const typeMs = Math.min(durMs * 0.75, (scene.html ? 400 : Math.max(1, scene.text.length) * 34));
  if (scene.html){ el.innerHTML = scene.html; scrollBottom(); await sleep(durMs); return; }
  await typeInto(el, scene.text, typeMs);
  await sleep(Math.max(0, durMs - typeMs));
}

async function run(){
  const TL = window.TIMELINE;
  document.title = 'RUNNING';
  for (const seg of TL.segments){
    const d = seg.dur * 1000;
    const sc = seg.scene || {type:'hold'};
    if (sc.type === 'title' || sc.type === 'outro') await card(sc, d);
    else if (sc.type === 'user') await bubble('user', sc, d);
    else if (sc.type === 'ai') await bubble('ai', sc, d);
    else await sleep(d);
  }
  await sleep(400);
  document.title = 'DONE';
}
window.addEventListener('load', () => { if (window.TIMELINE) run(); });
</script>
</body>
</html>
