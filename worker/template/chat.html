<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sage:#A0AC91; --sage-l:#BDC7AE; --wine:#7B3F50; --cream:#F5F1E8;
    --paper:#EDE7D9; --charcoal:#2A2520; --stone:#8B8478;
  }
  html,body { width:1080px; height:1920px; overflow:hidden; background:var(--charcoal);
    font-family:'Geist',-apple-system,'Segoe UI',sans-serif; color:var(--cream); }
  #stage { position:relative; width:100%; height:100%; }

  /* ---- cards (title / outro) ---- */
  .card { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    align-items:flex-start; padding:0 90px; background:var(--charcoal); z-index:30;
    opacity:0; transition:opacity .18s ease; }
  .card.show { opacity:1; }
  .card .kicker { font-family:'Geist Mono',monospace; font-size:34px; letter-spacing:.18em;
    color:var(--sage); text-transform:uppercase; margin-bottom:36px; }
  .card h1 { font-family:'Geist Mono',monospace; font-weight:700; font-size:104px; line-height:1.08; }
  .card h2 { font-size:52px; font-weight:400; color:var(--stone); margin-top:40px; line-height:1.25; }
  .card .rule { width:120px; height:6px; background:var(--sage); margin-top:56px; }

  /* ---- chat ---- */
  #chat { position:absolute; top:150px; bottom:480px; left:0; right:0; padding:0 60px;
    display:flex; flex-direction:column; gap:34px; overflow:hidden; }
  #topbar { position:absolute; top:0; left:0; right:0; height:110px; display:flex; align-items:center;
    padding:0 60px; gap:22px; border-bottom:2px solid rgba(245,241,232,.09); background:var(--charcoal); z-index:10;}
  #topbar .dot { width:20px; height:20px; border-radius:50%; background:var(--sage); }
  #topbar .name { font-family:'Geist Mono',monospace; font-size:34px; color:var(--cream); }
  #topbar .sub { font-size:28px; color:var(--stone); margin-left:auto; }
  .msg { max-width:82%; padding:34px 42px; border-radius:28px; font-size:40px; line-height:1.42;
    white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:rgba(160,172,145,.22); border:2px solid rgba(160,172,145,.45);
    border-bottom-right-radius:8px; }
  .msg.ai { align-self:flex-start; background:rgba(245,241,232,.07); border:2px solid rgba(245,241,232,.12);
    border-bottom-left-radius:8px; }
  .msg .caret { display:inline-block; width:4px; height:1em; background:var(--sage); vertical-align:-2px;
    animation:blink .8s steps(1) infinite; }
  @keyframes blink { 50% {opacity:0;} }
  .msg table { border-collapse:collapse; margin-top:10px; font-size:34px; }
  .msg td, .msg th { border:2px solid rgba(245,241,232,.2); padding:14px 22px; text-align:left; }
  .msg th { font-family:'Geist Mono',monospace; color:var(--sage-l); font-size:28px; }

  /* ---- badge ---- */
  #badge { position:absolute; left:60px; bottom:520px; z-index:20; font-family:'Geist Mono',monospace;
    font-size:40px; font-weight:700; letter-spacing:.06em; color:var(--charcoal); background:var(--sage);
    padding:22px 36px; border-radius:16px; opacity:0; transform:translateY(20px);
    transition:all .3s ease; }
  #badge.show { opacity:1; transform:none; }

  /* ---- flow: схема автоматизации, медленный проезд ---- */
  #flow { position:absolute; inset:0; z-index:40; background:var(--charcoal);
    opacity:0; transition:opacity .2s ease; overflow:hidden; }
  #flow.show { opacity:1; }
  #flowcanvas { position:absolute; left:0; top:0; will-change:transform; }
  #flowcanvas .node { position:absolute; background:#332E27; border:3px solid rgba(160,172,145,.55);
    border-radius:20px; padding:26px 32px; width:400px; box-shadow:0 18px 40px rgba(0,0,0,.45); }
  #flowcanvas .node .ttl { font-family:'Geist Mono',monospace; font-size:30px; color:var(--sage-l);
    letter-spacing:.04em; margin-bottom:12px; }
  #flowcanvas .node .sub { font-size:26px; color:var(--stone); line-height:1.3; }
  #flowcanvas .node.hot { border-color:var(--sage); background:#3B3A2C; }
  #flowcanvas svg { position:absolute; left:0; top:0; overflow:visible; }
  #flowcanvas svg path { fill:none; stroke:rgba(160,172,145,.5); stroke-width:4; }
  /* Одна строка поверх схемы — весь текст ролика, как в оригинале приёма. */
  #flowcap { position:absolute; left:60px; right:60px; bottom:180px; z-index:50;
    font-family:'Geist Mono',monospace; font-size:52px; font-weight:700; line-height:1.25;
    color:var(--cream); background:var(--charcoal); border-left:10px solid var(--sage);
    box-shadow:0 0 0 14px var(--charcoal), 0 22px 50px rgba(0,0,0,.6);
    padding:34px 40px; border-radius:12px; opacity:0; transition:opacity .25s ease; }
  #flowcap.show { opacity:1; }
</style>
</head>
<body>
<div id="stage">
  <div id="topbar"><div class="dot"></div><div class="name">AI-чат</div><div class="sub">демо</div></div>
  <div id="chat"></div>
  <div id="badge"></div>
  <div class="card" id="card"></div>
  <div id="flow"><div id="flowcanvas"></div></div>
  <div id="flowcap"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const chat = $('#chat');

function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }

async function typeInto(el, text, ms){
  const per = Math.max(12, ms / Math.max(1, text.length));
  const caret = document.createElement('span'); caret.className = 'caret';
  el.appendChild(caret);
  for (const ch of text){
    caret.insertAdjacentText('beforebegin', ch);
    scrollBottom();
    await sleep(per);
  }
  caret.remove();
}

function badge(text){
  const b = $('#badge');
  if (!text){ b.classList.remove('show'); return; }
  b.textContent = text; b.classList.add('show');
}

async function card(scene, durMs){
  const c = $('#card');
  c.innerHTML = (scene.kicker ? `<div class="kicker">${scene.kicker}</div>` : '')
    + (scene.h1 ? `<h1>${scene.h1}</h1>` : '')
    + (scene.h2 ? `<h2>${scene.h2}</h2>` : '')
    + '<div class="rule"></div>';
  c.classList.add('show');
  await sleep(durMs);
}

function hideCard(){ $('#card').classList.remove('show'); }

async function bubble(kind, scene, durMs){
  hideCard();
  if (scene.badge !== undefined) badge(scene.badge);
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  chat.appendChild(el); scrollBottom();
  const typeMs = Math.min(durMs * 0.75, (scene.html ? 400 : Math.max(1, scene.text.length) * 34));
  if (scene.html){ el.innerHTML = scene.html; scrollBottom(); await sleep(durMs); return; }
  await typeInto(el, scene.text, typeMs);
  await sleep(Math.max(0, durMs - typeMs));
}


// Схема шире и выше кадра: строим её один раз и медленно ведём камеру.
// Приём из разбора: смотреть не на объяснение, а на объём работающей машины.
async function flow(scene, durMs){
  hideCard();
  const wrap = $('#flow'), canvas = $('#flowcanvas'), cap = $('#flowcap');
  const nodes = scene.nodes || [];
  // Геометрия задаётся сценой: схема должна быть заметно выше кадра, иначе
  // проезжать нечего и приём рассыпается.
  const COLS = scene.cols || 2, DX = scene.dxStep || 460, DY = scene.dyStep || 340, PAD = 70;
  canvas.innerHTML = '';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', COLS * DX + 500);
  svg.setAttribute('height', Math.ceil(nodes.length / COLS) * DY + 400);
  canvas.appendChild(svg);

  const pos = [];
  nodes.forEach((n, i) => {
    let x, y;
    if (scene.zigzag){
      // Одна нода в ряду, со сдвигом через одну: лента тянется вниз на всю
      // высоту и при этом занимает кадр по ширине.
      y = PAD + i * DY;
      x = PAD + (i % 2 ? DX : 0);
    } else {
      const row = Math.floor(i / COLS);
      // Змейка: чётные ряды слева направо, нечётные обратно — линии не рвутся.
      const col = row % 2 ? COLS - 1 - (i % COLS) : i % COLS;
      x = PAD + col * DX; y = PAD + row * DY;
    }
    pos.push({x, y});
    const el = document.createElement('div');
    el.className = 'node' + (n.hot ? ' hot' : '');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = `<div class="ttl">${n.title}</div>` + (n.sub ? `<div class="sub">${n.sub}</div>` : '');
    canvas.appendChild(el);
  });
  for (let i = 1; i < pos.length; i++){
    const a = pos[i - 1], b = pos[i];
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const ax = a.x + 200, ay = a.y + 70, bx = b.x + 200, by = b.y + 70;
    p.setAttribute('d', `M ${ax} ${ay} C ${ax} ${(ay + by) / 2}, ${bx} ${(ay + by) / 2}, ${bx} ${by}`);
    svg.appendChild(p);
  }

  const H = (scene.zigzag ? nodes.length : Math.ceil(nodes.length / COLS)) * DY + PAD * 2;
  const travel = Math.max(0, H - 1920) + 260;
  const scale = scene.scale || 1;
  canvas.style.transform = `translate(0px, 0px) scale(${scale})`;
  canvas.style.transformOrigin = '0 0';
  wrap.classList.add('show');
  if (scene.caption){ cap.textContent = scene.caption; cap.classList.add('show'); }

  // Проезд идёт всю длительность сегмента — ровно, без рывков.
  const HOLD = Math.min(900, durMs * 0.08);
  await sleep(HOLD);
  canvas.style.transition = `transform ${durMs - HOLD}ms linear`;
  await sleep(30);
  canvas.style.transform = `translate(${scene.dx || 0}px, ${-travel}px) scale(${scale})`;
  await sleep(durMs - HOLD);
}

function hideFlow(){ $('#flow').classList.remove('show'); $('#flowcap').classList.remove('show'); }

async function run(){
  const TL = window.TIMELINE;
  document.title = 'RUNNING';
  for (const seg of TL.segments){
    const d = seg.dur * 1000;
    const sc = seg.scene || {type:'hold'};
    if (sc.type === 'flow'){ await flow(sc, d); continue; }
    hideFlow();
    if (sc.type === 'title' || sc.type === 'outro') await card(sc, d);
    else if (sc.type === 'user') await bubble('user', sc, d);
    else if (sc.type === 'ai') await bubble('ai', sc, d);
    else await sleep(d);
  }
  await sleep(400);
  document.title = 'DONE';
}
window.addEventListener('load', () => { if (window.TIMELINE) run(); });
</script>
</body>
</html>
